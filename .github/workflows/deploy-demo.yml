# Builds and publishes the DEMO (in-memory data, no sign-in, no Supabase) to GitHub Pages.
# Runs on every push to the branch claude/demo, and by hand from the Actions tab.
# The demo is checked before it goes out: tests, safety scan, and a check that the bundle
# has no Supabase, keys, network code or browser storage. No secrets or variables are used.
# Note: this and deploy.yml publish to the same Pages site, so the latest one to run wins.
name: deploy-demo

on:
  push:
    branches: [claude/demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (RLS on PGlite, Edge Functions with fakes, unit, demo database)
        run: npm test
      - name: Safety scan of every tracked file
        run: npm run scan
      - name: Build the demo (typecheck + vite --mode demo)
        run: npm run build:demo
      - name: The demo has no Supabase, keys, network code or browser storage
        run: npm run check:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
